[project]
name = "clipforge"
version = "0.1.0"
description = "ClipForge Studio — private, local-first AI video clipper (backend)"
requires-python = ">=3.11"
license = { text = "Proprietary — private use" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "scenedetect>=0.6.4",
    "faster-whisper>=1.1",
    "pocketsphinx>=5.0.3",
    "fonttools>=4.53",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "psutil>=6.0",
    "yt-dlp>=2024.8.6",
    "anthropic>=0.70",
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "scikit-image>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = [
    "slow: tests that render real video (deselect with -m 'not slow')",
]
